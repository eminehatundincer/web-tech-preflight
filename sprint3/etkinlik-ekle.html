<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>	Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2416501080.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>

    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
         <a href="index.html">Ana Sayfa</a>
         <a href="etkinlikler.html">Etkinlikler</a>
         <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>
      <p>Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

<form id="etkinlik-formu" novalidate>
    <p>
        <label for="ad">Etkinlik Adı *</label><br>
        <input type="text" id="ad" name="ad" placeholder="Örn. Kariyer Günleri" required>
        <span id="ad-hata" class="hata"></span>
    </p>

    <p>
        <label for="kategori">Kategori *</label><br>
        <select id="kategori" name="kategori" required>
            <option value="">Seçiniz</option>
            <option value="Seminer">Seminer</option>
            <option value="Atölye">Atölye</option>
            <option value="Söyleşi">Söyleşi</option>
        </select>
        <span id="kategori-hata" class="hata"></span>
    </p>

    <p>
        <label for="tarih">Tarih *</label><br>
        <input type="date" id="tarih" name="tarih" required>
        <span id="tarih-hata" class="hata"></span>
    </p>

    <p>
        <label for="saat">Saat *</label><br>
        <input type="time" id="saat" name="saat" required>
        <span id="saat-hata" class="hata"></span>
    </p>

    <p>
        <label for="yer">Yer *</label><br>
        <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu" required>
        <span id="yer-hata" class="hata"></span>
    </p>

    <p>
        <label for="kontenjan">Kontenjan</label><br>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
        <span id="kontenjan-hata" class="hata"></span>
    </p>

    <p>
        <label for="aciklama">Açıklama</label><br>
        <textarea id="aciklama" name="aciklama" rows="4" cols="40"></textarea>
    </p>

    <p>
        <button type="submit">Kaydet</button>
    </p>
</form>

<div id="form-mesaj"></div>
    </main>

    <footer>
        <p>Emine Hatun Dinçer · 2416501080 · 2026</p>
    </footer>

</body>
</html>
